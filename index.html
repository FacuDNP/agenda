<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda - Calendario</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: Arial; background: #f9f6ef; padding: 20px; margin: 0; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 20px; }
.header h1 { margin: 0; color: #8b7355; }
.header select { padding: 10px; border: 1px solid #c9a96e; border-radius: 6px; }
.nav-mes { display: flex; gap: 10px; align-items: center; }
.nav-mes button { padding: 8px 12px; background: #c9a96e; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
.nav-mes button:hover { background: #b8935a; }
.nav-mes span { font-weight: bold; color: #8b7355; min-width: 200px; text-align: center; }
.botones { display: flex; gap: 10px; }
.botones button { padding: 10px 15px; background: #c9a96e; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
.botones button:hover { background: #b8935a; }
.botones button.ics { background: #66bb6a; }
.botones button.ics:hover { background: #558b2f; }
@media (max-width: 768px) {
  .botones button { padding: 12px 20px; font-size: 14px; }
}
.container { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
@media (max-width: 1024px) {
  .container { grid-template-columns: 1fr; }
  .panel { margin-top: 20px; }
}
@media (max-width: 768px) {
  body { padding: 10px; }
  .header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .header h1 { font-size: 18px; }
  .header select { width: 100%; }
  .nav-mes { width: 100%; }
  .nav-mes span { min-width: auto; flex: 1; }
  .botones { width: 100%; flex-wrap: wrap; }
  .botones button { flex: 1; min-width: 100px; font-size: 12px; padding: 8px 10px; }
  .dia { min-height: 80px; font-size: 12px; }
  .numero-dia { font-size: 14px; }
  .evento-mini { font-size: 9px; }
  .panel { max-height: none; }
}
.calendario { background: white; border: 1px solid #e0d3b8; border-radius: 8px; padding: 20px; }
.dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 10px; }
.dia-semana { text-align: center; font-weight: bold; color: #8b7355; padding: 10px 0; border-bottom: 2px solid #c9a96e; }
.dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.dia { aspect-ratio: 1; border: 1px solid #e0d3b8; border-radius: 6px; padding: 8px; cursor: pointer; background: white; min-height: 100px; overflow-y: auto; }
.dia:hover { background: #f5f0e8; border-color: #c9a96e; }
.dia.hoy { border: 2px solid #c9a96e; background: #fffbf0; }
.dia.otro-mes { background: #fafaf8; color: #ccc; }
.numero-dia { font-weight: bold; margin-bottom: 5px; color: #8b7355; }
.evento-mini { font-size: 10px; padding: 3px; margin: 2px 0; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.vencimiento { background: #ffcdd2; color: #c62828; }
.compromiso { background: #bbdefb; color: #1565c0; }
.audiencia { background: #c8e6c9; color: #2e7d32; }
.tarea { background: #fff9c4; color: #f57f17; }
.panel { background: white; border: 1px solid #e0d3b8; border-radius: 8px; padding: 20px; max-height: 600px; overflow-y: auto; }
.panel h3 { color: #8b7355; margin-top: 0; }
.evento-detalle { background: #f9f6ef; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #c9a96e; }
.evento-detalle .hora { font-weight: bold; color: #8b7355; }
.evento-detalle .tipo { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin: 5px 0; }
.evento-detalle .descripcion { margin: 8px 0; font-size: 13px; }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
.modal.show { display: flex; align-items: center; justify-content: center; }
.modal-content { background: white; padding: 30px; border-radius: 8px; text-align: center; min-width: 300px; border: 1px solid #c9a96e; max-height: 85vh; overflow-y: auto; }
@media (max-width: 768px) {
  .modal-content { min-width: auto; width: 90%; padding: 20px; max-height: 90vh; }
}
.modal-content h2 { color: #8b7355; margin-top: 0; }
.modal-content button { padding: 12px 20px; margin: 10px; background: #c9a96e; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; min-width: 150px; }
.modal-content button:hover { background: #b8935a; }
.modal-content button.close { background: #999; }
.modal-content button.close:hover { background: #666; }
.form-grupo { margin: 15px 0; text-align: left; }
.form-grupo label { display: block; margin-bottom: 5px; font-weight: bold; color: #8b7355; }
.form-grupo input, .form-grupo select, .form-grupo textarea { width: 100%; padding: 10px; border: 1px solid #c9a96e; border-radius: 6px; box-sizing: border-box; font-family: Arial; }
.form-grupo textarea { resize: vertical; min-height: 80px; }
.resultado-expediente { padding: 10px; background: #f5f0e8; border: 1px solid #e0d3b8; border-radius: 4px; margin: 5px 0; cursor: pointer; }
.resultado-expediente:hover { background: #c9a96e; color: white; }
</style>
</head>
<body>

<div class="header">
  <h1>📅 Agenda</h1>
  <select id="filtroAbogado">
    <option value="">Todos</option>
  </select>
  <div class="nav-mes">
    <button onclick="mesAnterior()">◀</button>
    <span id="mesActual"></span>
    <button onclick="mesProximo()">▶</button>
    <button onclick="hoy()">Hoy</button>
  </div>
  <div class="botones">
    <button onclick="abrirModalNuevoEvento()">➕ Agregar evento</button>
    <button class="ics" onclick="abrirModal()">📥 Descargar .ics</button>
  </div>

</div>

<p id="estado">Cargando...</p>

<div class="container">
  <div class="calendario">
    <div class="dias-semana">
      <div class="dia-semana">Lun</div>
      <div class="dia-semana">Mar</div>
      <div class="dia-semana">Mié</div>
      <div class="dia-semana">Jue</div>
      <div class="dia-semana">Vie</div>
      <div class="dia-semana">Sáb</div>
      <div class="dia-semana">Dom</div>
    </div>
    <div class="dias" id="diasCalendario"></div>
  </div>
  <div class="panel">
    <h3>Eventos</h3>
    <div id="eventosPanel">Selecciona un día</div>
  </div>
</div>

<div id="modalDescargar" class="modal">
  <div class="modal-content">
    <h2>Descargar Agenda</h2>
    <p>¿Qué período deseas descargar?</p>
    <button onclick="descargarICS('todos')">📥 Todos los eventos</button>
    <button onclick="descargarICS('semana')">📆 Esta semana</button>
    <button onclick="descargarICS('mes')">🗓️ Este mes</button>
    <button class="close" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<div id="modalNuevoEvento" class="modal">
  <div class="modal-content" style="text-align: left; max-width: 350px; padding: 20px;">
    <h2 style="margin: 0 0 15px 0; font-size: 18px;">Nuevo Evento</h2>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Fecha *</label>
      <input type="date" id="eventoFecha" required>
    </div>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Hora *</label>
      <input type="time" id="eventoHora" required>
    </div>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Tipo *</label>
      <select id="eventoTipo" required>
        <option value="">Seleccionar...</option>
        <option value="Vencimiento">Vencimiento</option>
        <option value="Compromiso">Compromiso</option>
        <option value="Audiencia">Audiencia</option>
        <option value="Tarea">Tarea</option>
      </select>
    </div>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Descripción *</label>
      <textarea id="eventoDescripcion" required style="min-height: 60px;"></textarea>
    </div>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Responsable *</label>
      <select id="eventoResponsable" required>
        <option value="">Seleccionar...</option>
      </select>
    </div>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Expediente</label>
      <input type="text" id="eventoExpedienteBuscador" placeholder="Buscar..." onkeyup="filtrarExpedientes()" style="padding: 8px;">
      <div id="resultadosExpedientes" style="margin-top: 3px; max-height: 100px; overflow-y: auto;"></div>
      <input type="hidden" id="eventoExpediente">
    </div>
    <div class="form-grupo" style="margin: 10px 0;">
      <label style="margin-bottom: 3px;">Recordar (días)</label>
      <input type="number" id="eventoDias" value="0" min="0" style="padding: 8px;">
    </div>
    <div style="text-align: center; margin-top: 15px;">
      <button onclick="guardarEvento()" style="background: #66bb6a; padding: 10px 20px;">💾 Guardar</button>
      <button class="close" onclick="cerrarModalNuevoEvento()" style="padding: 10px 20px;">Cancelar</button>
    </div>
  </div>
</div>

<script>
let agenda = [];
let abogados = [];
let expedientes = [];
let mesActual = new Date();
let abogadoFiltro = '';
let mapeoAbogados = {}; // Mapeo de nombre completo a nombre corto usado en agenda

function mesAnterior() { mesActual.setMonth(mesActual.getMonth() - 1); dibujarCalendario(); }
function mesProximo() { mesActual.setMonth(mesActual.getMonth() + 1); dibujarCalendario(); }
function hoy() { mesActual = new Date(); dibujarCalendario(); }

function abrirModal() {
  document.getElementById('modalDescargar').classList.add('show');
}

function cerrarModal() {
  document.getElementById('modalDescargar').classList.remove('show');
}

function abrirModalNuevoEvento() {
  document.getElementById('modalNuevoEvento').classList.add('show');
}

function cerrarModalNuevoEvento() {
  document.getElementById('modalNuevoEvento').classList.remove('show');
}

function filtrarExpedientes() {
  let valor = document.getElementById('eventoExpedienteBuscador').value.toLowerCase();
  let resultados = document.getElementById('resultadosExpedientes');
  
  if(!valor) {
    resultados.innerHTML = '';
    return;
  }
  
  let filtrados = expedientes.filter(e => {
    let texto = (e.caratula || '') + ' ' + (e.num_1inst || '');
    return texto.toLowerCase().includes(valor);
  });
  
  let html = '';
  filtrados.forEach(e => {
    html += `<div class="resultado-expediente" onclick="seleccionarExpediente(${e.id}, '${(e.caratula || '').replace(/'/g, "\\'")}')">
      <strong>${e.caratula || 'Sin caratula'}</strong><br>
      <small>${e.num_1inst || ''}</small>
    </div>`;
  });
  
  resultados.innerHTML = html || '<div style="padding: 10px; color: #999;">Sin resultados</div>';
}

function seleccionarExpediente(id, caratula) {
  document.getElementById('eventoExpediente').value = id;
  document.getElementById('eventoExpedienteBuscador').value = caratula;
  document.getElementById('resultadosExpedientes').innerHTML = '';
}

async function guardarEvento() {
  let fecha = document.getElementById('eventoFecha').value;
  let hora = document.getElementById('eventoHora').value;
  let tipo = document.getElementById('eventoTipo').value;
  let descripcion = document.getElementById('eventoDescripcion').value;
  let responsableSelect = document.getElementById('eventoResponsable').value;
  let expediente = document.getElementById('eventoExpediente').value;
  let aviso = document.getElementById('eventoDias').value;
  
  if(!fecha || !hora || !tipo || !descripcion || !responsableSelect) {
    alert('Completa todos los campos obligatorios');
    return;
  }
  
  // Buscar el nombre completo del abogado
  let abogado = abogados.find(a => a.nombre === responsableSelect);
  let responsableCompleto = abogado ? abogado.nombre : responsableSelect;
  
  try {
    const { createClient } = window.supabase;
    let supabase = createClient('https://lzmawlqnifakmzwudkti.supabase.co', 'sb_publishable_2YWuP5GbRSdLpqR3AlaK3Q_ORD13xp1');
    
    const { data, error } = await supabase.from('agenda').insert([{
      fecha: fecha,
      hora: hora,
      tipo_ag: tipo,
      descripcion: descripcion,
      responsable: responsableCompleto,
      expediente_id: expediente ? parseInt(expediente) : null,
      aviso_dias: parseInt(aviso) || 0
    }]);
    
    if(error) {
      alert('Error: ' + error.message);
      return;
    }
    
    // Recargar agenda
    const { data: ag } = await supabase.from('agenda').select('*');
    agenda = ag || [];
    
    cerrarModalNuevoEvento();
    dibujarCalendario();
    alert('Evento guardado ✔');
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

function cambiarAbogado() {
  abogadoFiltro = document.getElementById('filtroAbogado').value;
  dibujarCalendario();
}

function eventoCoincideConFiltro(evento) {
  if(!abogadoFiltro) return true;
  // Buscar qué nombre corto corresponde al abogado seleccionado
  let nombreCorto = mapeoAbogados[abogadoFiltro];
  if(nombreCorto) {
    return evento.responsable === nombreCorto;
  }
  // Si no hay mapeo, buscar por coincidencia de primera palabra
  let primeraNombre = abogadoFiltro.split(' ')[0].toLowerCase();
  return evento.responsable && evento.responsable.toLowerCase().includes(primeraNombre);
}

function mostrarDetalle(fecha) {
  let eventos = agenda.filter(e => e.fecha === fecha && eventoCoincideConFiltro(e));
  if(eventos.length === 0) {
    document.getElementById('eventosPanel').innerHTML = 'No hay eventos';
    return;
  }
  let html = '';
  eventos.sort((a, b) => a.hora.localeCompare(b.hora)).forEach(e => {
    let clase = e.tipo_ag.toLowerCase();

    // Buscar expediente vinculado
    let expedienteInfo = '';
    if(e.expediente_id) {
      let exp = expedientes.find(x => x.id === e.expediente_id);
      if(exp) {
        expedienteInfo = `<div>📁 ${exp.caratula || 'Expediente ' + exp.id}</div>`;
      }
    }

    html += `<div class="evento-detalle">
      <div class="hora">${e.hora}</div>
      <div class="tipo ${clase}">${e.tipo_ag}</div>
      <div class="descripcion">${e.descripcion}</div>
      <div>👤 ${e.responsable || 'Sin asignar'}</div>
      ${expedienteInfo}
    </div>`;
  });
  document.getElementById('eventosPanel').innerHTML = html;
}

function descargarICS(periodo) {
  let eventos = agenda.filter(e => eventoCoincideConFiltro(e));
  let hoy = new Date();
  
  if(periodo === 'semana') {
    let inicioSemana = new Date(hoy);
    inicioSemana.setDate(hoy.getDate() - hoy.getDay() + 1); // Lunes
    let finSemana = new Date(inicioSemana);
    finSemana.setDate(inicioSemana.getDate() + 6); // Domingo
    
    let inicioStr = inicioSemana.toISOString().split('T')[0];
    let finStr = finSemana.toISOString().split('T')[0];
    eventos = eventos.filter(e => e.fecha >= inicioStr && e.fecha <= finStr);
  } else if(periodo === 'mes') {
    let mes = hoy.getMonth();
    let anio = hoy.getFullYear();
    let inicioMes = new Date(anio, mes, 1);
    let finMes = new Date(anio, mes + 1, 0);
    
    let inicioStr = inicioMes.toISOString().split('T')[0];
    let finStr = finMes.toISOString().split('T')[0];
    eventos = eventos.filter(e => e.fecha >= inicioStr && e.fecha <= finStr);
  }
  
  let ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Agenda//v1\nCALSCALE:GREGORIAN\n';
  eventos.forEach(e => {
    let fecha = e.fecha.replace(/-/g, '');
    let hora = (e.hora || '00:00').replace(/:/g, '');
    ics += `BEGIN:VEVENT\nDTSTART:${fecha}T${hora}00Z\nSUMMARY:${e.descripcion}\nDESCRIPTION:${e.tipo_ag}\nUID:${e.id}@agenda\nEND:VEVENT\n`;
  });
  ics += 'END:VCALENDAR';
  
  let blob = new Blob([ics], {type: 'text/calendar'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = 'agenda.ics';
  a.click();
  cerrarModal();
}

function dibujarCalendario() {
  let mes = mesActual.getMonth();
  let anio = mesActual.getFullYear();
  let meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('mesActual').innerText = meses[mes] + ' ' + anio;

  let primerDia = new Date(anio, mes, 1);
  let ultimoDia = new Date(anio, mes + 1, 0);
  let diasMes = ultimoDia.getDate();
  let inicioDia = primerDia.getDay() || 7;
  
  let html = '';
  let diasMesAnt = new Date(anio, mes, 0).getDate();
  for(let i = inicioDia - 1; i > 0; i--) {
    html += `<div class="dia otro-mes"><div class="numero-dia">${diasMesAnt - i + 1}</div></div>`;
  }
  
  let hoy = new Date();
  for(let d = 1; d <= diasMes; d++) {
    let fecha = new Date(anio, mes, d);
    let fechaStr = fecha.toISOString().split('T')[0];
    let esHoy = fecha.toDateString() === hoy.toDateString();
    let eventos = agenda.filter(e => e.fecha === fechaStr && eventoCoincideConFiltro(e));
    let html_eventos = eventos.map(e => `<div class="evento-mini ${e.tipo_ag.toLowerCase()}" onclick="mostrarDetalle('${fechaStr}')">${e.hora}</div>`).join('');
    html += `<div class="dia ${esHoy ? 'hoy' : ''}" onclick="mostrarDetalle('${fechaStr}')">
      <div class="numero-dia">${d}</div>
      ${html_eventos}
    </div>`;
  }
  
  let diasSig = 42 - (inicioDia - 1 + diasMes);
  for(let d = 1; d <= diasSig; d++) {
    html += `<div class="dia otro-mes"><div class="numero-dia">${d}</div></div>`;
  }
  
  document.getElementById('diasCalendario').innerHTML = html;
}

(async () => {
  const SUPABASE_URL = 'https://lzmawlqnifakmzwudkti.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2YWuP5GbRSdLpqR3AlaK3Q_ORD13xp1';

  for(let i = 0; i < 50; i++) {
    if(window.supabase && window.supabase.createClient) {
      const { createClient } = window.supabase;
      let supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data: ag } = await supabase.from('agenda').select('*');
      const { data: ab } = await supabase.from('abogados').select('*');
      const { data: ex } = await supabase.from('expedientes').select('*');
      agenda = ag || [];
      abogados = (ab || []).filter(a => a.activo === 1);
      expedientes = ex || [];
      
      // Crear mapeo: asociar cada nombre completo con su versión corta en agenda
      abogados.forEach(a => {
        let nombrePartes = a.nombre.split(' ');
        let primerNombre = nombrePartes[0].toLowerCase();
        let segundoNombre = nombrePartes[1] ? nombrePartes[1].toLowerCase() : '';
        
        let eventosAbogado = agenda.filter(e => {
          let responsable = (e.responsable || '').toLowerCase();
          let respPartes = responsable.split(' ');
          // Debe coincidir EXACTAMENTE el primer nombre Y tener el segundo apellido
          // "Alejandro Esequiel Dorado Albornoz" → busca "Alejandro" + "Dorado"
          return respPartes[0] === primerNombre && responsable.includes('dorado');
        });
        
        if(eventosAbogado.length > 0) {
          let responsables = eventosAbogado.map(e => e.responsable);
          let masFrecuente = responsables.reduce((acc, cur) => 
            (responsables.filter(x => x === acc).length >= responsables.filter(x => x === cur).length) ? acc : cur
          );
          mapeoAbogados[a.nombre] = masFrecuente;
        }
      });
      
      console.log('Mapeo:', mapeoAbogados);
      let select = document.getElementById('filtroAbogado');
      abogados.forEach(a => {
        let opt = document.createElement('option');
        opt.value = a.nombre;
        opt.text = a.nombre;
        select.appendChild(opt);
      });
      select.addEventListener('change', cambiarAbogado);
      
      // Llenar select de responsables en el formulario
      let selectResp = document.getElementById('eventoResponsable');
      abogados.forEach(a => {
        let opt = document.createElement('option');
        opt.value = a.nombre;
        opt.text = a.nombre;
        selectResp.appendChild(opt);
      });
      
      // Llenar select de expedientes
      let selectExp = document.getElementById('eventoExpediente');
      expedientes.forEach(e => {
        let opt = document.createElement('option');
        opt.value = e.id;
        opt.text = e.caratula || 'Expediente ' + e.id;
        selectExp.appendChild(opt);
      });
      document.getElementById('estado').innerText = `✔ ${agenda.length} eventos`;
      dibujarCalendario();
      break;
    }
    await new Promise(r => setTimeout(r, 100));
  }
})();
</script>
</body>
</html>
